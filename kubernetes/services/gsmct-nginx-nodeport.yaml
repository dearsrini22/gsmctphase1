apiVersion: v1
kind: Service
metadata:
  name: gsmct-nginx-nodeport
spec:
  type: NodePort
  selector:
    app: gsmctdeploy   # Selects Pods with the label 'app: my-app'
  ports:
  - protocol: TCP
    port: 8095        # needed The port the Service exposes internally within the cluster
    targetPort: 8080 # needed - The port on the Pod where the application is listening
    nodePort: 30080 # The port on each Node that will be opened for external access (optional, Kubernetes assigns if not specified, typically in range 30000-32767)
